# fly.toml app configuration file generated for ping-definitive on 2026-10-26T16:13:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ping-definitive'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  PING_HTTPS = '1'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
